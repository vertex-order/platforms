# Owned by vertex-order/kit — edit here. Vendored elsewhere via sync.toml;
# don't edit the copy there.
#
# Fail a PR (or a push to main that bypassed the pre-commit guard) whose
# .github/workflows/*.yml doesn't validate against the real published
# GitHub Actions schemas. @action-validator/cli (+ @action-validator/core)
# is a real devDependency -- see docs/tooling.md. Not `actionlint` itself
# (that npm package is wasm-wrapped with no CLI bin); @action-validator/cli
# is a separate, real implementation that has one. See `just check-actions`.
#
# Only checks .github/workflows/*.yml this repo actually owns
# (scripts/sync.py --unvendored) -- see check-ruff.yml's comment, same
# reasoning.
name: Check workflow YAML

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  action-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether .github/workflows/*.yml is vendored here
        id: vendored
        run: |
          files=$(python3 scripts/sync.py --unvendored .github/workflows/*.yml)
          if [ -z "$files" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo ".github/workflows/*.yml is vendored from kit here, already checked upstream — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node
        if: steps.vendored.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        if: steps.vendored.outputs.skip != 'true'
        run: npm install --no-fund --no-audit

      - name: Validate .github/workflows/*.yml
        if: steps.vendored.outputs.skip != 'true'
        run: |
          files=$(python3 scripts/sync.py --unvendored .github/workflows/*.yml)
          for f in $files; do
            npx action-validator "$f" || exit 1
          done
