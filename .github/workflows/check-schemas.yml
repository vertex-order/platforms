# Owned by vertex-order/kit — edit here. Vendored elsewhere via sync.toml;
# don't edit the copy there.
#
# Fail a PR (or a push to main that bypassed the pre-commit guard) whose
# schemas/*.schema.json isn't well-formed JSON Schema (2020-12). ajv-cli
# is a real devDependency -- see docs/tooling.md. An independent
# cross-check scripts/validate-data.py's own hand-rolled validator can't
# give itself. --strict=false only silences ajv's advisory nag about this
# repo's two union-type fields, not a real error. See `just check-schemas`.
#
# Skipped entirely if schemas/*.schema.json is all vendored
# (scripts/sync.py --unvendored) -- e.g. a full list repo, where the whole
# schemas/ dir is one [subscribe.kit] entry. Where it isn't (e.g. org: two
# local schemas alongside two vendored ones) this still compiles the
# *full* glob, not just the unvendored files -- a local schema's $ref can
# point at a vendored one (common.schema.json), so dropping the vendored
# files here would break resolution rather than just skip redundant
# checking of them.
name: Check JSON Schemas

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ajv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether schemas/*.schema.json is vendored here
        id: vendored
        run: |
          files=$(python3 scripts/sync.py --unvendored schemas/*.schema.json 2>/dev/null)
          if [ -z "$files" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "schemas/*.schema.json is vendored from kit here, already checked upstream — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node
        if: steps.vendored.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        if: steps.vendored.outputs.skip != 'true'
        run: npm install --no-fund --no-audit

      - name: Validate schemas/*.schema.json
        if: steps.vendored.outputs.skip != 'true'
        run: npx ajv compile -s "schemas/*.schema.json" --spec=draft2020 --strict=false
