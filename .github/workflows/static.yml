# Owned by vertex-order/kit — edit here. Vendored elsewhere via sync.toml;
# don't edit the copy there.
#
# Build site/ and push build/ into vertex-order/site's
# public/<this-repo-name>/, instead of self-deploying to Pages.
name: Sync site to Pages repo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: project/.node-version

      - name: Build
        working-directory: project
        run: just build

      - name: Checkout site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vertex-order/site
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site-repo

      - name: Sync build/ into public/<repo>/
        run: |
          mkdir -p "site-repo/public/${{ github.event.repository.name }}"
          rsync -a --delete project/build/ "site-repo/public/${{ github.event.repository.name }}/"

      - name: Commit and push
        working-directory: site-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "public/${{ github.event.repository.name }}"
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync ${{ github.event.repository.name }} from ${{ github.event.repository.name }}"
            git push
          fi
