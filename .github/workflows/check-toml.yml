# Owned by vertex-order/kit — edit here. Vendored elsewhere via sync.toml;
# don't edit the copy there.
#
# Fail a PR (or a push to main that bypassed the pre-commit guard) whose
# *.toml doesn't pass taplo's lint + format check. @taplo/cli is a real
# devDependency -- see docs/tooling.md. Piped through stdin, not passed
# as a file argument -- see `just check-toml`'s comment for why.
#
# Only checks *.toml this repo actually owns (scripts/sync.py
# --unvendored) -- see check-ruff.yml's comment, same reasoning.
# sync.toml itself never matches (every repo's own [subscribe.kit] shape
# genuinely differs); sync.list.toml/uv.toml, where present, do.
name: Check TOML

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  taplo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check whether *.toml is vendored here
        id: vendored
        run: |
          files=$(python3 scripts/sync.py --unvendored *.toml)
          if [ -z "$files" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "*.toml is vendored from kit here, already checked upstream — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node
        if: steps.vendored.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        if: steps.vendored.outputs.skip != 'true'
        run: npm install --no-fund --no-audit

      - name: Lint + format-check *.toml
        if: steps.vendored.outputs.skip != 'true'
        run: |
          files=$(python3 scripts/sync.py --unvendored *.toml)
          for f in $files; do
            cat "$f" | npx taplo lint - || exit 1
            cat "$f" | npx taplo fmt --check - || exit 1
          done
