# Owned by vertex-order/kit — edit here. Vendored elsewhere via sync.toml;
# don't edit the copy there.
#
# Fail a PR (or a push to main that bypassed the pre-commit guard) whose
# site/data/index.js + series-*.js contain cross-listed duplicate game
# entries (same dedupeKey per page.dc.html's dupGroups logic) whose
# description/tags/rating/length/platforms/languages have drifted apart.
name: Check dedup drift

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dedup-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for drift between duplicate/cross-listed game entries
        run: python3 scripts/check-dedup-drift.py
