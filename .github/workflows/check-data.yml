# Owned by vertex-order/kit — edit here. Vendored elsewhere via sync.toml;
# don't edit the copy there.
#
# Fail a PR (or a push to main that bypassed the pre-commit guard) whose
# site/data/*.js doesn't match its schemas/*.schema.json. See
# scripts/validate-data.py and `just check-data` -- pure Python, no
# external deps, so unlike check-css.yml there's no Node setup step here.
name: Check data schemas

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate site/data/*.js against schemas/*.schema.json
        run: python3 scripts/validate-data.py
