# sync.toml — cross-repo file sync. Read by scripts/sync.py (`just sync`).
# See AGENTS.md → "Cross-repo sync" and CONTRIBUTING.md.
#
# [publish]      — what THIS repo owns and other repos pull. Documentation;
#                  sync.py only uses it to refuse clobbering an owned path.
# [subscribe.*]  — what THIS repo vendors FROM elsewhere. sync.py fetches these
#                  at `ref` and writes them into the tree. Vendored copies —
#                  never hand-edit; edit them in the owning repo.
#                  check-vendored.yml fails the PR if any has drifted.
#
# Not vendored, even though this repo needs one: .github/ISSUE_TEMPLATE/*
# and .github/PULL_REQUEST_TEMPLATE.md — each necessarily carries this
# repo's own Discussions URL (and PR-checklist lines specific to the icon
# grids), so they can never satisfy sync.py's byte-identical-or-flagged
# guarantee. Seeded from kit's copies once, then maintained locally.

[publish]
owner = "vertex-order/platforms"
# The platform-icon micro-kit: the component, its data, and its artwork.
# kit pulls all of it; the list repos get it transitively via kit.
paths = [
  "site/PlatformIcon.dc.html",
  "site/data/platform-icons.js",
  "site/images/platforms/",
]
# platforms-only, not published: site/page.dc.html (the tuning bench),
# site/ZoomedPlatformIcon.dc.html (2x wrapper — kit doesn't need it).

[publish.consumers]  # for humans; sync.py ignores this
"vertex-order/kit" = "pulls every path above; re-bundles PlatformIcon into its own components.js"
"vertex-order/<list>" = "gets them transitively via kit"

[subscribe.kit]
repo = "vertex-order/kit"
ref  = "main"   # pin to a commit SHA / tag for reproducibility: `just sync-update kit`
paths = [
  "site/_ds/",
  "site/images/ui/",
  "site/support.js",
  "site/BackToTop.dc.html",
  "site/HelpWanted.dc.html",
  "scripts/bundle-components.py",
  "scripts/sync.py",
  "scripts/normalize-svg.py",
  "scripts/strip-c2pa.py",
  "scripts/trim-svg.py",
  "svgo.config.mjs",
  "justfile",
  ".editorconfig",
  ".gitattributes",
  ".claude/settings.json",
  "CODE_OF_CONDUCT.md",
  ".githooks/pre-commit",
  ".github/workflows/check-generated.yml",
  ".github/workflows/check-vendored.yml",
  ".github/workflows/static.yml",
  ".github/dependabot.yml",
]
# TODO: add the theme-swap component here once kit factors it out of its page.
