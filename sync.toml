# sync.toml — cross-repo file sync. Read by scripts/sync.py (`just sync`).
# See AGENTS.md → "Cross-repo sync" and CONTRIBUTING.md.
#
# [publish]      — what THIS repo owns and other repos pull. Documentation;
#                  sync.py only uses it to refuse clobbering an owned path.
# [subscribe.*]  — what THIS repo vendors FROM elsewhere. sync.py fetches these
#                  at `ref` and writes them into the tree. Vendored copies —
#                  never hand-edit; edit them in the owning repo.
#                  check-vendored.yml fails the PR if any has drifted.
#
# Not vendored, even though this repo needs one: .github/ISSUE_TEMPLATE/*
# and .github/PULL_REQUEST_TEMPLATE.md — each necessarily carries this
# repo's own Discussions URL (and PR-checklist lines specific to the icon
# grids), so they can never satisfy sync.py's byte-identical-or-flagged
# guarantee. Seeded from kit's copies once, then maintained locally.

[publish]
owner = "vertex-order/platforms"
# The platform-icon micro-kit: the component, its data, and its artwork.
# Pulled directly by kit *and* by every list repo — not transitively
# through kit. Expect more [subscribe.platforms] consumers as new repos
# get added; this isn't a two-repo relationship.
paths = [
  "site/PlatformIcon.dc.html",
  "site/data/platform-icons.js",
  "site/images/platforms/",
]
# platforms-only, not published: site/page.dc.html (the tuning bench),
# site/ZoomedPlatformIcon.dc.html (2x wrapper — kit doesn't need it).

[publish.consumers]  # for humans; sync.py ignores this
"vertex-order/kit" = "pulls every path above; re-bundles PlatformIcon into its own components.js for its tuning bench"
"vertex-order/<list>" = "pulls every path above directly (not via kit) — see sync.list.toml in kit"

[subscribe.kit]
repo = "vertex-order/kit"
ref = "07875b0c234f2b54b3e49d3eaa93f8fde6187063"
paths = [
  "docs/cache.md",
  "docs/tooling.md",
  ".prettierignore",
  "uv.toml",
  "schemas/platform-icons.schema.json",
  "site/_ds/",
  "site/images/ui/",
  "site/support.js",
  "site/theme-dev.js",
  "site/BackToTop.dc.html",
  "site/Footer.dc.html",
  "site/HelpWanted.dc.html",
  "site/Metadata.dc.html",
  "site/ThemeToggle.dc.html",
  "scripts/bundle-components.py",
  "scripts/ssr-render.js",
  "scripts/ssr-lib.js",
  "scripts/sync.py",
  "scripts/js_literal.py",
  "scripts/validate-data.py",
  "scripts/check-dedup-drift.py",
  "scripts/normalize-svg.py",
  "scripts/restore-headers.py",
  "scripts/ensure-helmets.py",
  "scripts/strip-c2pa.py",
  "scripts/trim-svg.py",
  "svgo.config.mjs",
  ".stylelintrc.cjs",
  "justfile",
  "package.json",
  "package-lock.json",
  ".npmrc",
  ".node-version",
  ".gitignore",
  ".editorconfig",
  ".gitattributes",
  ".claude/settings.json",
  "CODE_OF_CONDUCT.md",
  ".githooks/pre-commit",
  ".github/workflows/fix-build.yml",
  ".github/workflows/autofix.yml",
  ".github/workflows/autofix-apply.yml",
  ".github/workflows/check-generated.yml",
  ".github/workflows/check-vendored.yml",
  ".github/workflows/check-data.yml",
  ".github/workflows/check-ruff.yml",
  ".github/workflows/check-format.yml",
  ".github/workflows/check-dedup-drift.yml",
  ".github/workflows/check-css.yml",
  ".github/workflows/check-syntax.yml",
  ".github/workflows/sync-repin.yml",
  ".github/workflows/static.yml",
  ".github/dependabot.yml",
]
